<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escritório Virtual VEX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Escritório virtual: tela cheia escura, painel de ambientes à esquerda, modelo 3D ocupando o resto. */
:root {
  --bg: #111516; --panel: #171c1e; --line: #2a3234; --ink: #e7eae8; --ink-2: #93a0a1;
  --petrol: #2f8f94; --orange: #e27c40;
  --f-display: 'Archivo', 'Arial Narrow', Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.4 var(--f-mono); overflow: hidden; }
.app { display: grid; grid-template-columns: 270px minmax(0, 1fr); height: 100%; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding-left: env(safe-area-inset-left, 0px); }
.brand { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid var(--line); }
.brand .plate { width: 46px; height: 46px; background: #fff; border-radius: 2px; flex: none; display: grid; place-items: center; }
.brand .plate img { width: 100%; height: 100%; }
.brand b { display: block; font: 800 14px/1.1 var(--f-display); font-stretch: 118%; letter-spacing: 0.12em; }
.brand span { font-size: 11px; color: var(--ink-2); letter-spacing: 0.06em; }
.rooms { overflow-y: auto; padding: 10px 8px 16px; display: flex; flex-direction: column; gap: 2px; }
.rooms h2 { font: 500 10.5px/1 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); margin: 14px 8px 6px; }
.rooms button {
  text-align: left; font: 500 13px/1.25 var(--f-mono); color: var(--ink); background: transparent;
  border: 1px solid transparent; border-radius: 4px; padding: 9px 10px; cursor: pointer;
}
.rooms button:hover { background: #1f2628; }
.rooms button[aria-pressed="true"] { background: var(--petrol); color: #fff; }
.rooms button:focus-visible, .tools button:focus-visible, .tools label:focus-within { outline: 2px solid var(--orange); outline-offset: 1px; }
main { position: relative; min-width: 0; min-height: 0; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; left: 14px; right: calc(14px + env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; justify-content: space-between; gap: 12px; pointer-events: none; }
.title { pointer-events: none; }
.title h1 { margin: 0; font: 800 clamp(18px, 2.2vw, 26px)/1.05 var(--f-display); text-shadow: 0 1px 12px rgba(0,0,0,.5); }
.title p { margin: 4px 0 0; font-size: 12px; color: #c9d1d1; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; pointer-events: auto; align-self: flex-start; }
.tools button, .tools label {
  font: 600 12px/1 var(--f-mono); color: var(--ink); background: rgba(17, 21, 22, 0.82); border: 1px solid var(--line);
  border-radius: 4px; padding: 9px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; backdrop-filter: blur(6px);
}
.tools input { accent-color: var(--petrol); margin: 0; }
.help { position: absolute; left: 14px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); font-size: 11.5px; color: #c9d1d1; background: rgba(17,21,22,.72); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 13px; color: var(--ink-2); background: var(--bg); }
.loading[hidden] { display: none !important; }
.menu-btn { display: none; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  aside { border-right: 0; border-bottom: 1px solid var(--line); padding-right: env(safe-area-inset-right, 0px); }
  .brand { padding: 10px 16px; }
  .brand .plate { width: 36px; height: 36px; }
  .rooms { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 8px 16px; gap: 6px; }
  .rooms h2 { display: none; }
  .rooms button { white-space: nowrap; border-color: var(--line); padding: 8px 10px; }
  .help { display: none; }
  .title p { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="plate"><img id="logo" alt="Logo oficial do Grupo VEX" width="500" height="500"></div><div><b>GRUPO VEX</b><span>escritório virtual · sede</span></div></div>
    <nav class="rooms" id="rooms" aria-label="Ambientes"></nav>
  </aside>
  <main>
    <canvas id="c" aria-label="Escritório virtual 3D da sede do Grupo VEX"></canvas>
    <div class="hud">
      <div class="title"><h1 id="room-title">Maquete — vista geral</h1><p>Sede Grupo VEX · 260 m² · estudo preliminar</p></div>
      <div class="tools">
        <label><input type="checkbox" id="ceiling"> Teto</label>
        <button type="button" id="tour" aria-pressed="false">▶ Tour</button>
      </div>
    </div>
    <div class="help">Arraste para girar · role ou pince para aproximar · botão direito ou dois dedos para mover</div>
    <div class="loading" id="loading">montando o escritório…</div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="js/logos.js"></script>
<script src="js/model.js"></script>
<script src="js/plan.js"></script>
<script src="js/scene3d.js"></script>
<script>
(function () {
  const M = window.VEX_MODEL;
  document.getElementById('logo').src = window.VEX_LOGOS['grupo-vex'];
  const GROUPS = [
    ['Maquete', ['aerea', 'aerea-ne']],
    ['Entrada', ['recepcao', 'ecossistema', 'galeria']],
    ['Trabalho', ['operacoes', 'painel', 'planejamento', 'ceo', 'reuniao']],
    ['Administrativo', ['financeiro', 'juridico']],
    ['Convivência', ['copa', 'jogos', 'wc']],
  ];
  const label = (v) => v.title.replace('Maquete — ', 'Maquete ');
  const nav = document.getElementById('rooms');
  nav.innerHTML = GROUPS.map(([g, ids]) => `<h2>${g}</h2>` + ids.map(id => { const v = M.views.find(x => x.id === id); return `<button type="button" data-v="${id}" aria-pressed="false">${label(v)}</button>`; }).join('')).join('');
  const order = GROUPS.flatMap(g => g[1]);
  const title = document.getElementById('room-title'), ceil = document.getElementById('ceiling');
  let viewer = null, current = 'aerea', tourTimer = null;

  function show(id) {
    current = id;
    const v = M.views.find(x => x.id === id);
    viewer.go(id); ceil.checked = v.ceiling !== false; title.textContent = v.title;
    nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === id)));
    const b = nav.querySelector(`[data-v="${id}"]`); if (b) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    try { history.replaceState(null, '', '#' + id); } catch (e) { /* sem histórico */ }
  }
  function stopTour() { clearInterval(tourTimer); tourTimer = null; const t = document.getElementById('tour'); t.textContent = '▶ Tour'; t.setAttribute('aria-pressed', 'false'); }

  window.VEX3D.mountViewer(document.getElementById('c')).then(v => {
    viewer = v;
    document.getElementById('loading').hidden = true;
    const start = (location.hash || '').slice(1);
    show(order.includes(start) ? start : 'aerea');
  }).catch(e => { console.error(e); document.getElementById('loading').textContent = 'Este navegador não liberou o 3D (WebGL). Tente o Chrome ou o Edge atualizados.'; });

  nav.addEventListener('click', e => { const b = e.target.closest('button'); if (b && viewer) { stopTour(); show(b.dataset.v); } });
  ceil.addEventListener('change', () => viewer && viewer.setCeiling(ceil.checked));
  document.getElementById('tour').addEventListener('click', e => {
    if (!viewer) return;
    if (tourTimer) return stopTour();
    e.currentTarget.textContent = '■ Parar'; e.currentTarget.setAttribute('aria-pressed', 'true');
    let i = order.indexOf(current);
    tourTimer = setInterval(() => { i = (i + 1) % order.length; show(order[i]); }, 4500);
  });
  document.getElementById('c').addEventListener('pointerdown', () => { if (tourTimer) stopTour(); });
})();
</script>
</body>
</html>
